# Copy to .github/workflows/deploy.yml
#
# NOTE: `needs:` only chains jobs *inside the same workflow file*. It cannot
# point at a job in ci.yml. So this file re-runs the tests itself in a `quality`
# job, and `publish` waits for it. That costs about forty seconds and means a
# failing test can never produce a published image.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff pytest
      - run: ruff check src tests
      - run: pytest -q

  publish:
    needs: quality          # skipped entirely if quality failed
    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "Published ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Roll back by redeploying an earlier SHA tag."
